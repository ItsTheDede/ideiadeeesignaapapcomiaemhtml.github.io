<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | LAM</title>

    <script>
      try {
        var t = localStorage.getItem('lam-theme');
        document.documentElement.dataset.theme = t || 'dark';
      } catch(e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/backgroud.css">
    <style>
                /* =========================================================
        LAM · Estilos globais
        ========================================================= */

        /* ---------- Tema claro (por defeito) ---------- */
        :root {
        --bg: #f5f5f5;
        --bg-2: #ffffff;
        --card: #ffffff;
        --txt: #111111;
        --txt-2: #555555;
        --muted: #888888;
        --line: rgba(0,0,0,.10);
        --accent: #ffd500;
        --accent-2: #f5b800;
        --accent-txt: #000000;
        --ok: #16a34a;
        --warn: #d97706;
        --err: #dc2626;
        --shadow: 0 10px 30px rgba(0,0,0,.08);

        --c1: #0057ff;
        --c2: #ff2e63;
        --c3: #00a651;
        }

        /* ---------- Tema escuro ---------- */
        [data-theme="dark"] {
        --bg: #0a0a0a;
        --bg-2: #121212;
        --card: #151515;
        --txt: #f2f2f2;
        --txt-2: #b8b8b8;
        --muted: #888888;
        --line: rgba(255,255,255,.10);
        --accent: #ffd500;
        --accent-2: #f5b800;
        --accent-txt: #000000;
        --ok: #22c55e;
        --warn: #f59e0b;
        --err: #ef4444;
        --shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        /* ---------- Reset ---------- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
        font-family: 'Archivo', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--txt);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        transition: background .25s, color .25s;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        img, svg { display: block; max-width: 100%; }

        /* ---------- Layout ---------- */
        .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        }

        /* ---------- Header ---------- */
        .top {
        position: sticky; top: 0; z-index: 50;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
        }
        .top-inner {
        max-width: 1200px; margin: 0 auto; padding: 14px 24px;
        display: flex; align-items: center; gap: 16px;
        }
        .brand {
        display: flex; align-items: center; gap: 10px;
        font-weight: 900; font-size: 20px; letter-spacing: -.5px;
        }
        .brand .mark {
        width: 36px; height: 36px; border-radius: 10px;
        background: var(--accent); display: grid; place-items: center;
        }
        .brand b { color: var(--accent); background: #000; padding: 0 4px; border-radius: 4px; }
        [data-theme="dark"] .brand b { color: #000; background: var(--accent); }

        .plate {
        font-family: monospace; font-weight: 700; font-size: 12px;
        padding: 6px 10px; border-radius: 6px;
        border: 1px solid var(--line); background: var(--bg-2);
        letter-spacing: 1px;
        }
        .hide-s { display: inline-block; }
        @media (max-width: 640px) { .hide-s { display: none; } }

        .top nav {
        margin-left: auto; display: flex; align-items: center; gap: 6px;
        }
        .top nav a {
        padding: 8px 14px; border-radius: 8px;
        font-weight: 500; font-size: 14px; color: var(--txt-2);
        transition: .15s;
        }
        .top nav a:hover { background: var(--bg-2); color: var(--txt); }
        .top nav a.active { color: var(--txt); background: var(--bg-2); }
        .top nav a.cta {
        background: var(--accent); color: var(--accent-txt);
        font-weight: 700;
        }
        .top nav a.cta:hover { background: var(--accent-2); }
        .theme {
        width: 38px; height: 38px; border-radius: 10px;
        background: var(--bg-2); border: 1px solid var(--line);
        display: grid; place-items: center; font-size: 16px;
        }
        .burger { display: none; font-size: 22px; padding: 6px 10px; }

        @media (max-width: 800px) {
        .burger { display: block; margin-left: auto; }
        .top nav { display: none; }
        .top nav.open {
            display: flex; flex-direction: column; align-items: stretch;
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--bg); border-bottom: 1px solid var(--line);
            padding: 12px;
        }
        .top nav.open a { padding: 12px; }
        }

        /* ---------- Botões ---------- */
        .btn {
        display: inline-flex; align-items: center; justify-content: center;
        gap: 8px; padding: 10px 18px; border-radius: 10px;
        font-weight: 700; font-size: 14px;
        transition: .15s;
        }
        .btn-primary { background: var(--accent); color: var(--accent-txt); }
        .btn-primary:hover { background: var(--accent-2); }
        .btn-ghost {
        background: transparent; color: var(--txt);
        border: 1px solid var(--line);
        }
        .btn-ghost:hover { background: var(--bg-2); }
        .btn-light { background: #fff; color: #000; }
        .btn-light:hover { background: #eee; }

        /* ---------- Hero (index) ---------- */
        .hero {
        position: relative; overflow: hidden;
        padding: 80px 24px 60px;
        }
        .hero-inner { max-width: 900px; margin: 0 auto; position: relative; z-index: 2; text-align: center; }
        .hero .deco {
        position: absolute; width: 340px; height: 340px;
        opacity: .12; pointer-events: none;
        }
        .hero .deco.d1 { top: -60px; left: -80px; }
        .hero .deco.d2 { bottom: -100px; right: -60px; }

        .hero .pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 8px 14px; border-radius: 999px;
        background: var(--bg-2); border: 1px solid var(--line);
        font-size: 13px; color: var(--txt-2); margin-bottom: 24px;
        }
        .hero .pill i {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--ok); box-shadow: 0 0 0 4px rgba(34,197,94,.2);
        }
        .hero h1 {
        font-size: clamp(32px, 6vw, 64px);
        font-weight: 900; line-height: 1.05;
        letter-spacing: -1.5px; margin-bottom: 20px;
        }
        .hero h1 em {
        font-style: normal; background: var(--accent);
        color: var(--accent-txt); padding: 0 8px; border-radius: 6px;
        }
        .hero .lede {
        font-size: 17px; color: var(--txt-2);
        max-width: 640px; margin: 0 auto 32px;
        }

        .procura {
        display: flex; gap: 8px; max-width: 600px;
        margin: 0 auto 20px;
        }
        .procura input {
        flex: 1; padding: 14px 18px; border-radius: 12px;
        background: var(--bg-2); border: 1px solid var(--line);
        color: var(--txt); font-size: 15px;
        }
        .procura input:focus { outline: none; border-color: var(--accent); }

        .quick {
        display: flex; flex-wrap: wrap; gap: 8px;
        justify-content: center; align-items: center;
        font-size: 13px; color: var(--muted);
        }
        .quick a {
        padding: 6px 12px; border-radius: 999px;
        background: var(--bg-2); border: 1px solid var(--line);
        cursor: pointer; transition: .15s;
        }
        .quick a:hover { border-color: var(--accent); color: var(--txt); }

        .stats {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 16px; max-width: 900px; margin: 48px auto 0;
        }
        .stats > div {
        background: var(--bg-2); border: 1px solid var(--line);
        border-radius: 14px; padding: 20px; text-align: center;
        }
        .stats b { display: block; font-size: 28px; color: var(--accent); }
        .stats span { font-size: 13px; color: var(--txt-2); }
        @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }

        /* ---------- Faixa rolante ---------- */
        .ticker {
        overflow: hidden; background: var(--accent); color: #000;
        padding: 12px 0; font-weight: 700;
        }
        .ticker .track {
        display: flex; gap: 32px; white-space: nowrap;
        animation: roll 30s linear infinite;
        }
        .ticker .track span { font-size: 14px; }
        @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .hazard {
        height: 10px;
        background: repeating-linear-gradient(45deg, #000 0 20px, var(--accent) 20px 40px);
        }

        /* ---------- Secções ---------- */
        section { padding: 60px 0; }
        .sec-head { margin-bottom: 32px; }
        .sec-head .eyebrow {
        display: inline-block; font-size: 12px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 2px;
        color: var(--accent); margin-bottom: 10px;
        }
        .sec-head h2 {
        font-size: clamp(24px, 3.5vw, 38px);
        font-weight: 900; letter-spacing: -1px; margin-bottom: 8px;
        }
        .sec-head p { color: var(--txt-2); }

        /* ---------- Categorias ---------- */
        .cats {
        display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px;
        }
        .cats a {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 16px; border-radius: 999px;
        background: var(--bg-2); border: 1px solid var(--line);
        font-size: 14px; font-weight: 500; cursor: pointer; transition: .15s;
        }
        .cats a:hover { border-color: var(--accent); }
        .cats a.on { background: var(--accent); color: var(--accent-txt); border-color: var(--accent); }
        .cats .ic { font-size: 16px; }

        /* ---------- Toolbar ---------- */
        .toolbar {
        display: flex; flex-wrap: wrap; gap: 12px;
        justify-content: space-between; align-items: center;
        margin-bottom: 24px;
        }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chips button {
        padding: 8px 14px; border-radius: 999px;
        background: var(--bg-2); border: 1px solid var(--line);
        font-size: 13px; transition: .15s;
        }
        .chips button.on { background: var(--accent); color: var(--accent-txt); border-color: var(--accent); }
        .toolbar select {
        padding: 10px 14px; border-radius: 10px;
        background: var(--bg-2); border: 1px solid var(--line);
        color: var(--txt); font-size: 14px;
        }

        /* ---------- Grelha de peças ---------- */
        .pecas {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        }
        .peca {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 16px; overflow: hidden;
        transition: .2s; display: flex; flex-direction: column;
        }
        .peca:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); }
        .peca .foto {
        position: relative; aspect-ratio: 16/10;
        background: linear-gradient(135deg, rgba(255,213,0,.15), rgba(255,213,0,.02));
        display: grid; place-items: center;
        }
        .peca .foto strong {
        position: absolute; top: 10px; left: 10px;
        font-size: 11px; padding: 4px 10px; border-radius: 999px;
        background: var(--accent); color: var(--accent-txt);
        font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
        }
        .peca .foto small {
        position: absolute; top: 10px; right: 10px;
        font-size: 11px; color: var(--txt-2);
        }
        .peca .foto .em { font-size: 56px; }
        .peca .pb { padding: 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .peca h3 { font-size: 16px; font-weight: 700; line-height: 1.3; }
        .peca .ref { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
        .peca .loja { font-size: 13px; color: var(--txt-2); }
        .peca .pf { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .peca .preco { font-size: 22px; font-weight: 900; color: var(--accent); }
        .peca .res {
        padding: 10px 16px; border-radius: 10px;
        background: var(--accent); color: var(--accent-txt);
        font-weight: 700; font-size: 13px; transition: .15s;
        }
        .peca .res:hover { background: var(--accent-2); }
        .peca .res.ok { background: var(--ok); color: #fff; }
        .peca .res:disabled { opacity: .85; cursor: default; }

        .vazio-box {
        grid-column: 1/-1; text-align: center; padding: 60px 20px;
        color: var(--txt-2);
        }
        .vazio-box b { display: block; font-size: 40px; margin-bottom: 16px; }
        .vazio-box .btn { margin-top: 16px; }

        /* ---------- Passos ---------- */
        .passos {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        }
        .passo {
        position: relative; padding: 30px 24px;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 16px;
        }
        .passo .n {
        position: absolute; top: -14px; left: 24px;
        width: 32px; height: 32px; border-radius: 50%;
        background: var(--accent); color: var(--accent-txt);
        display: grid; place-items: center; font-weight: 900;
        }
        .passo .pi { font-size: 32px; margin-bottom: 12px; }
        .passo h3 { font-size: 18px; margin-bottom: 6px; }
        .passo p { color: var(--txt-2); font-size: 14px; }

        /* ---------- Mapa ---------- */
        .mapa-top {
        display: flex; justify-content: space-between; align-items: flex-end;
        gap: 20px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .leg { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
        .leg span::before {
        content: ''; display: inline-block; width: 10px; height: 10px;
        border-radius: 50%; margin-right: 6px;
        background: currentColor;
        }
        .leg .c-c1 { color: var(--c1); }
        .leg .c-c2 { color: var(--c2); }
        .leg .c-c3 { color: var(--c3); }
        #mapa { height: 420px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
        .pin {
        width: 36px; height: 36px; border-radius: 50% 50% 50% 0;
        background: var(--c); display: grid; place-items: center;
        color: #fff; font-weight: 900; font-size: 12px;
        transform: rotate(-45deg);
        box-shadow: 0 4px 12px rgba(0,0,0,.3);
        }
        .pin span { transform: rotate(45deg); }

        /* ---------- Parceiros ---------- */
        .parceiros {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        }
        .parceiro {
        padding: 24px; border-radius: 16px;
        background: var(--card); border: 1px solid var(--line);
        display: flex; flex-direction: column; gap: 10px;
        transition: .2s; cursor: pointer;
        }
        .parceiro:hover { border-color: var(--accent); transform: translateY(-4px); }
        .parceiro .av {
        width: 48px; height: 48px; border-radius: 12px;
        background: var(--cc, var(--accent)); color: #fff;
        display: grid; place-items: center; font-weight: 900;
        }
        .parceiro.c-c1 { --cc: var(--c1); }
        .parceiro.c-c2 { --cc: var(--c2); }
        .parceiro.c-c3 { --cc: var(--c3); }
        .parceiro b { font-size: 17px; }
        .parceiro .d { font-size: 13px; color: var(--txt-2); }
        .parceiro .meta { display: flex; gap: 6px; flex-wrap: wrap; }
        .parceiro .ft { display: flex; justify-content: space-between; font-size: 13px; margin-top: auto; }
        .parceiro .go { color: var(--accent); font-weight: 700; }

        .tag {
        display: inline-block; font-size: 11px; padding: 4px 8px;
        border-radius: 6px; background: var(--bg-2);
        border: 1px solid var(--line); color: var(--txt-2);
        }
        .tag.ver { color: var(--ok); border-color: var(--ok); }

        /* ---------- Sobre ---------- */
        .sobre {
        display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        padding: 40px; border-radius: 20px;
        background: var(--card); border: 1px solid var(--line);
        }
        @media (max-width: 800px) { .sobre { grid-template-columns: 1fr; padding: 24px; } }
        .sobre .lead { color: var(--txt-2); margin-top: 12px; }
        .pontos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 500px) { .pontos { grid-template-columns: 1fr; } }
        .pontos > div { padding: 16px; background: var(--bg-2); border-radius: 12px; }
        .pontos .pe { font-size: 24px; margin-bottom: 8px; display: block; }
        .pontos h3 { font-size: 15px; margin-bottom: 4px; }
        .pontos p { font-size: 13px; color: var(--txt-2); }

        /* ---------- CTA ---------- */
        .cta-band {
        display: flex; justify-content: space-between; align-items: center;
        gap: 20px; flex-wrap: wrap;
        padding: 40px; border-radius: 20px;
        background: var(--accent); color: var(--accent-txt);
        }
        .cta-band h2 { font-size: 26px; margin-bottom: 6px; }
        .cta-band p { opacity: .8; }

        /* ---------- Footer ---------- */
        .foot { padding: 60px 0 30px; border-top: 1px solid var(--line); }
        .foot-grid {
        max-width: 1200px; margin: 0 auto; padding: 0 24px;
        display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px;
        }
        @media (max-width: 700px) { .foot-grid { grid-template-columns: 1fr; } }
        .foot p { color: var(--txt-2); font-size: 14px; margin-top: 12px; max-width: 320px; }
        .foot h4 {
        font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
        color: var(--muted); margin-bottom: 14px;
        }
        .foot a { display: block; padding: 4px 0; color: var(--txt-2); font-size: 14px; }
        .foot a:hover { color: var(--accent); }
        .copy {
        text-align: center; color: var(--muted); font-size: 13px;
        margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line);
        }

        /* ---------- Toast ---------- */
        .toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
        background: var(--accent); color: var(--accent-txt);
        padding: 14px 24px; border-radius: 12px; font-weight: 700;
        box-shadow: var(--shadow); opacity: 0; transition: .3s;
        z-index: 1000; pointer-events: none;
        }
        .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ---------- Animações ---------- */
        .rv { opacity: 0; transform: translateY(20px); transition: .6s ease; }
        .rv.in { opacity: 1; transform: none; }

        .shake { animation: shake .4s; }
        @keyframes shake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
        }

        /* =========================================================
        LOGIN / REGISTO
        ========================================================= */
        .login-page {
        display: grid; grid-template-columns: 1fr 1fr;
        min-height: calc(100vh - 66px);
        }
        @media (max-width: 900px) { .login-page { grid-template-columns: 1fr; } }

        .login-side {
        padding: 60px 48px;
        background: linear-gradient(135deg, rgba(255,213,0,.06), transparent);
        border-right: 1px solid var(--line);
        display: flex; flex-direction: column; gap: 30px;
        position: relative; overflow: hidden;
        }
        .login-side .disc {
        position: absolute; bottom: -120px; right: -80px;
        width: 400px; height: 400px; opacity: .18;
        pointer-events: none;
        }
        .login-side .disc .a { fill: var(--accent); }
        .login-side .disc .b { fill: #000; }
        .login-side > div { position: relative; z-index: 1; }
        .login-side .eyebrow {
        display: inline-block; font-size: 12px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 2px;
        color: var(--accent); margin-bottom: 14px;
        }
        .login-side h1 {
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 900; line-height: 1.1;
        letter-spacing: -1px; margin-bottom: 16px;
        }
        .login-side .gtext { background: var(--accent); color: var(--accent-txt); padding: 0 8px; border-radius: 6px; }
        .login-side p { color: var(--txt-2); max-width: 420px; }

        .vant { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
        .vant > div {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px; border-radius: 12px;
        background: var(--bg-2); border: 1px solid var(--line);
        font-size: 14px;
        }
        .vant > div span { font-size: 18px; }

        .lista { display: flex; flex-direction: column; gap: 8px; margin-top: 30px; }
        .lista > div {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px; border-radius: 12px;
        background: var(--bg-2); border: 1px solid var(--line);
        font-size: 14px;
        }
        .lista i {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--cc, var(--accent));
        }
        .lista .c-c1 { --cc: var(--c1); }
        .lista .c-c2 { --cc: var(--c2); }
        .lista .c-c3 { --cc: var(--c3); }
        .lista b { flex: 1; }
        .lista span { color: var(--muted); font-size: 12px; }

        /* Formulário */
        .form-wrap {
        display: flex; align-items: center; justify-content: center;
        padding: 40px 24px;
        }
        .card {
        width: 100%; max-width: 460px;
        padding: 32px;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 20px; box-shadow: var(--shadow);
        }
        .card h2 { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
        .card .sub { color: var(--txt-2); font-size: 14px; margin-bottom: 24px; }

        .tipo-conta {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 10px; margin-bottom: 20px;
        }
        .tipo-conta .opt {
        display: flex; align-items: center; gap: 10px;
        padding: 14px; border-radius: 12px;
        background: var(--bg-2); border: 1px solid var(--line);
        cursor: pointer; transition: .15s;
        }
        .tipo-conta .opt:hover { border-color: var(--accent); }
        .tipo-conta .opt.on { background: var(--accent); color: var(--accent-txt); border-color: var(--accent); }
        .tipo-conta input { display: none; }
        .tipo-conta .ico { font-size: 20px; }
        .tipo-conta span { display: flex; flex-direction: column; }
        .tipo-conta strong { font-size: 14px; }
        .tipo-conta small { font-size: 11px; opacity: .75; }

        .campo { margin-bottom: 16px; }
        .campo.duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .campo.full { grid-column: 1 / -1; }
        .campo label {
        display: block; font-size: 12px; font-weight: 600;

        .pw { position: relative; }

        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        padding: 6px 10px; font-size: 12px; font-weight: 700;

        }
        .pw .ver:hover { background: rgba(255,213,0,.1); }

        .linha {
        display: flex; justify-content: space-between; align-items: center;
        gap: 12px; flex-wrap: wrap; font-size: 13px;

        .linha label { display: flex; align-items: center; gap: 6px; color: var(--txt-2); }

        .erro {
        padding: 12px 14px; border-radius: 10px;

        .entrar {
        width: 100%; padding: 14px; border-radius: 12px;

        .ok-box { text-align: center; padding: 20px; }

<script>
        /* =========================================================
    animations.js
    Código isolado por página para evitar conflitos de variáveis
    ========================================================= */

    /* =========================================================
    BLOCO 1 · PÁGINA INICIAL (index.php)
    ========================================================= */
    (function () {
    if (!document.querySelector('#pecasGrid')) return;

    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const eur = v => new Intl.NumberFormat('pt-PT').format(v) + ' €';

    function toast(msg, ms = 2400){
        const t = $('#toast'); if (!t) return;
        t.textContent = msg; t.classList.add('on');
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms);
    }

    /* Menu móvel */
    const burger = $('.burger');
    if (burger) burger.addEventListener('click', () => $('.top nav').classList.toggle('open'));

    /* Tema */
    const temaBtn = $('#tema');
    function pintarTema(){ if (temaBtn) temaBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
    pintarTema();
    if (temaBtn) temaBtn.addEventListener('click', () => {
        const novo = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = novo;
        try { localStorage.setItem('lam-theme', novo); } catch(e) {}
        pintarTema();
    });

    /* Dados */
    const categorias = [
        ['Motor','⚙️'],['Travagem','🛑'],['Suspensão','🔩'],['Elétrica','⚡'],
        ['Arrefecimento','❄️'],['Iluminação','💡'],['Pneus','🛞'],['Carroçaria','🚗']
    ];
    const parceiros = [
        {cor:'c1', nome:'Samiparts', sigla:'SP', desc:'Peças originais e equivalentes', local:'Flandes',        nota:'4.8'},
        {cor:'c2', nome:'Guipeças',  sigla:'GP', desc:'Peças multimarca',              local:'Marinha Grande', nota:'4.6'},
        {cor:'c3', nome:'Gamipeças', sigla:'GM', desc:'Peças e acessórios',            local:'Pombal',         nota:'4.9'}
    ];
    const lojas = [
        {nome:'Samiparts', sigla:'SP', cor:'#0057ff', tipo:'Loja', info:'R. da Primavera B1, 3100-339 Flandes', coords:[39.90397077796481, -8.633328093923474], gmaps:'https://www.google.com/maps'},
        {nome:'Guipeças',  sigla:'GP', cor:'#ff2e63', tipo:'Loja', info:'Av. Nossa Sra. da Guia 124, 3105-089 Pombal', coords:[39.944691581714224, -8.788271679867668], gmaps:'https://www.google.com/maps'},
        {nome:'Gamipeças', sigla:'GM', cor:'#00a651', tipo:'Loja', info:'R. António Champalimaud, 3100-578 Pombal', coords:[39.92511456042214, -8.631716401323908], gmaps:'https://www.google.com/maps'}
    ];
    const iconeCat = Object.fromEntries(categorias);
    const pecas = [
        {titulo:'Pastilhas de travão dianteiras', ref:'BRK-1024', cat:'Travagem',      loja:'Samiparts', cor:'c1', preco:120, estado:'Novo'},
        {titulo:'Filtro de óleo',                 ref:'FLT-2210', cat:'Motor',         loja:'Samiparts', cor:'c1', preco:15,  estado:'Novo'},
        {titulo:'Amortecedor traseiro',           ref:'AMT-7781', cat:'Suspensão',     loja:'Samiparts', cor:'c1', preco:95,  estado:'Usado'},
        {titulo:'Alternador 90A',                 ref:'ALT-5540', cat:'Elétrica',      loja:'Guipeças',  cor:'c2', preco:210, estado:'Recondicionado'},
        {titulo:'Radiador de água',               ref:'RAD-3302', cat:'Arrefecimento', loja:'Guipeças',  cor:'c2', preco:140, estado:'Novo'},
        {titulo:'Farol dianteiro esquerdo',       ref:'FAR-9910', cat:'Iluminação',    loja:'Gamipeças', cor:'c3', preco:320, estado:'Novo'},
        {titulo:'Pneu 205/55 R16',                ref:'PNE-4408', cat:'Pneus',         loja:'Gamipeças', cor:'c3', preco:85,  estado:'Novo'}
    ];

    let catAtiva = '', estAtivo = '';
    const reservadas = new Set();

    /* Stats */
    const statsEl = $('#stats');
    if (statsEl) statsEl.innerHTML = `
        <div><b data-count="${parceiros.length}">0</b><span>Empresas parceiras</span></div>
        <div><b data-count="${pecas.length}">0</b><span>Peças em catálogo</span></div>
        <div><b data-count="30" data-suf=" km">0</b><span>Raio de entrega</span></div>
        <div><b>Hoje</b><span>Entrega no próprio dia</span></div>`;

    /* Atalhos */
    const quickEl = $('#quick');
    if (quickEl) {
        quickEl.innerHTML = '<span>Popular:</span>' + ['Travagem','Motor','Pneus','Elétrica'].map(c => `<a data-q="${c}">${c}</a>`).join('');
        quickEl.addEventListener('click', e => {
        const a = e.target.closest('a'); if (!a) return;
        $('#q').value = a.dataset.q; catAtiva = ''; renderPecas();
        document.querySelector('#pecas').scrollIntoView({behavior:'smooth'});
        });
    }

    /* Faixa */
    const trackEl = $('#track');
    if (trackEl) {
        const faixa = categorias.map(([c,i]) => `<span>${i} ${esc(c)}</span>`).join('');
        trackEl.innerHTML = faixa + faixa + faixa + faixa;
    }

    /* Parceiros */
    const parceirosList = $('#parceirosList');
    if (parceirosList) {
        parceirosList.innerHTML = parceiros.map(p => {
        const n = pecas.filter(x => x.loja === p.nome).length;
        return `
        <div class="parceiro c-${p.cor} rv" data-loja="${esc(p.nome)}">
            <div class="av">${esc(p.sigla)}</div>
            <b>${esc(p.nome)}</b>
            <div class="d">${esc(p.desc)}</div>
            <div class="meta"><span class="tag">📍 ${esc(p.local)}</span><span class="tag ver">✓ Verificado</span></div>
            <div class="ft"><span><b>${n}</b> peças · <b>${esc(p.nota)}</b> ★</span><span class="go">Ver peças →</span></div>
        </div>`;
        }).join('');
        parceirosList.addEventListener('click', e => {
        const card = e.target.closest('.parceiro'); if (!card) return;
        $('#q').value = card.dataset.loja; catAtiva = ''; estAtivo = ''; renderPecas();
        document.querySelector('#pecas').scrollIntoView({behavior:'smooth'});
        toast('A mostrar peças de ' + card.dataset.loja);
        });
    }

    /* Mapa */
    if (typeof L !== 'undefined' && $('#mapa')) {
        const legEl = $('#leg');
        if (legEl) legEl.innerHTML = parceiros.map(p => `<span class="c-${p.cor}">${esc(p.nome)}</span>`).join('');
        const map = L.map('mapa',{scrollWheelZoom:false}).setView([39.75,-8.83],11);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
        lojas.forEach(l => {
        const icone = L.divIcon({className:'', html:`<div class="pin" style="--c:${l.cor}"><span>${esc(l.sigla)}</span></div>`, iconSize:[36,36], iconAnchor:[18,36], popupAnchor:[0,-36]});
        L.marker(l.coords,{icon:icone}).addTo(map)
            .bindPopup(`<b>${esc(l.nome)}</b><br>${esc(l.info)}`);
        });
    }

    /* Categorias */
    function renderCats(){
        const el = $('#cats'); if (!el) return;
        el.innerHTML = categorias.map(([c,i]) =>
        `<a data-cat="${esc(c)}" class="${catAtiva===c?'on':''}"><span class="ic">${i}</span>${esc(c)}</a>`).join('');
    }
    const catsEl = $('#cats');
    if (catsEl) catsEl.addEventListener('click', e => {
        const a = e.target.closest('a'); if (!a) return;
        catAtiva = catAtiva === a.dataset.cat ? '' : a.dataset.cat;
        renderPecas();
    });

    function renderChips(){
        const el = $('#chipsEstado'); if (!el) return;
        const estados = ['', 'Novo', 'Usado', 'Recondicionado'];
        el.innerHTML = estados.map(s =>
        `<button type="button" data-e="${s}" class="${estAtivo===s?'on':''}">${s || 'Todos'}</button>`).join('');
    }
    const chipsEl = $('#chipsEstado');
    if (chipsEl) chipsEl.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        estAtivo = b.dataset.e; renderPecas();
    });

    function limparFiltros(){
        $('#q').value = ''; catAtiva = ''; estAtivo = ''; $('#ordem').value = '';
        renderPecas();
    }

    function renderPecas(){
        const raw = $('#q').value.trim(), q = raw.toLowerCase(), ord = $('#ordem').value;
        let lista = pecas.filter(p =>
        (!q || (p.titulo+' '+p.ref+' '+p.loja+' '+p.cat+' '+p.estado).toLowerCase().includes(q)) &&
        (!catAtiva || p.cat === catAtiva) &&
        (!estAtivo || p.estado === estAtivo));
        if (ord) lista = [...lista].sort((a,b) => ord === 'asc' ? a.preco-b.preco : b.preco-a.preco);

        const filtrado = q || catAtiva || estAtivo;
        $('#pecasSub').textContent = filtrado
        ? `${lista.length} ${lista.length === 1 ? 'resultado' : 'resultados'}` + (raw ? ` para "${raw}"` : '') + (catAtiva ? ` em ${catAtiva}` : '') + (estAtivo ? ` (${estAtivo})` : '') + '.'
        : 'Stock atualizado pelas próprias lojas.';
        renderCats(); renderChips();

        const box = $('#pecasGrid');
        if (!lista.length){
        box.innerHTML = '<div class="vazio-box"><b>🔍</b>Sem resultados. Tente outra pesquisa ou limpe os filtros.<br><button class="btn btn-ghost" type="button" id="limpar">Limpar filtros</button></div>';
        const l = $('#limpar'); if (l) l.addEventListener('click', limparFiltros);
        return;
        }
        box.innerHTML = lista.map((p, n) => {
        const r = reservadas.has(p.ref);
        return `
        <article class="peca c-${p.cor}" style="--i:${n}">
            <div class="foto"><strong>${esc(p.estado)}</strong><small>Hoje</small><span class="em">${iconeCat[p.cat] || '🔧'}</span></div>
            <div class="pb">
            <h3>${esc(p.titulo)}</h3>
            <p class="ref"><span class="plate"><span>${esc(p.ref)}</span></span>${esc(p.cat)}</p>
            <p class="loja">${esc(p.loja)}</p>
            <div class="pf">
                <span class="preco">${eur(p.preco)}</span>
                <button class="res${r?' ok':''}" type="button" data-ref="${esc(p.ref)}"${r?' disabled':''}>${r?'Reservado ✓':'Reservar'}</button>
            </div>
            </div>
        </article>`;
        }).join('');
    }

    const formProcura = $('#formProcura');
    if (formProcura) formProcura.addEventListener('submit', () => {
        catAtiva = ''; renderPecas();
        document.querySelector('#pecas').scrollIntoView({behavior:'smooth'});
    });
    const qEl = $('#q'); if (qEl) qEl.addEventListener('input', renderPecas);
    const ordemEl = $('#ordem'); if (ordemEl) ordemEl.addEventListener('change', renderPecas);
    const gridEl = $('#pecasGrid');
    if (gridEl) gridEl.addEventListener('click', e => {
        const b = e.target.closest('.res'); if (!b || b.disabled) return;
        reservadas.add(b.dataset.ref);
        b.classList.add('ok'); b.textContent = 'Reservado ✓'; b.disabled = true;
        toast('Peça reservada! Receberá confirmação por email.');
    });

    renderPecas();
    })();


    /* =========================================================
    BLOCO 2 · LOGIN / REGISTO
    ========================================================= */
    (function () {
    const isLogin = !!document.querySelector('#loginForm');
    const isRegisto = !!document.querySelector('#form');
    if (!isLogin && !isRegisto) return;

    const $ = s => document.querySelector(s);

    function toast(msg, ms = 2400){
        const t = $('#toast'); if (!t) return;
        t.textContent = msg; t.classList.add('on');
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms);
    }

    const burger = $('.burger');
    if (burger) burger.addEventListener('click', () => $('.top nav').classList.toggle('open'));

    const temaBtn = $('#tema');
    function pintarTema(){ if (temaBtn) temaBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
    pintarTema();
    if (temaBtn) temaBtn.addEventListener('click', () => {
        const novo = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = novo;
        try { localStorage.setItem('lam-theme', novo); } catch(e) {}
        pintarTema();
    });

    /* LOGIN */
    if (isLogin) {
        const textos = {
        empresa: {
            eyebrow: 'Área de parceiros',
            titulo: 'Bem-vindo de volta à <span class="gtext">oficina</span>.',
            texto: 'Entre na sua conta para reservar peças auto, acompanhar encomendas e levantar na loja ou receber no próprio dia.',
            sub: 'Acesso para oficinas e empresas parceiras.',
            emailPh: 'oficina@exemplo.pt',
            dica: 'oficina@exemplo.pt / 123456'
        },
        cliente: {
            eyebrow: 'Área de cliente',
            titulo: 'Bem-vindo de volta à <span class="gtext">estrada</span>.',
            texto: 'Entre na sua conta para pesquisar peças auto, guardar reservas e levantar junto de quem tem stock, perto de si.',
            sub: 'Acesso para clientes particulares.',
            emailPh: 'cliente@exemplo.pt',
            dica: 'demo@lam.pt / demo'
        }
        };
        const tipoConta = () => document.querySelector('input[name="conta"]:checked').value;

        function aplicarTipo(){
        const t = tipoConta(), x = textos[t];
        const oc = $('#optCliente'); if (oc) oc.classList.toggle('on', t === 'cliente');
        const oe = $('#optEmpresa'); if (oe) oe.classList.toggle('on', t === 'empresa');
        const ve = $('#vantEmpresa'); if (ve) ve.hidden = t !== 'empresa';
        const vc = $('#vantCliente'); if (vc) vc.hidden = t !== 'cliente';
        const se = $('#sideEyebrow'); if (se) se.textContent = x.eyebrow;
        const st = $('#sideTitulo');  if (st) st.innerHTML = x.titulo;
        const sx = $('#sideTexto');   if (sx) sx.textContent = x.texto;
        const su = $('#subTxt');      if (su) su.textContent = x.sub;
        const em = $('#email');       if (em) em.placeholder = x.emailPh;
        const er = $('#erro');        if (er) er.style.display = 'none';
        }
        document.querySelectorAll('input[name="conta"]').forEach(r => r.addEventListener('change', aplicarTipo));
        if (new URLSearchParams(location.search).get('tipo') === 'cliente') {
        const c = document.querySelector('input[value="cliente"]'); if (c) c.checked = true;
        }
        aplicarTipo();

        const verBtn = $('#ver');
        if (verBtn) verBtn.addEventListener('click', () => {
        const p = $('#pass'); const mostrar = p.type === 'password';
        p.type = mostrar ? 'text' : 'password'; verBtn.textContent = mostrar ? 'Ocultar' : 'Mostrar';
        });
        const esqueci = $('#esqueci');
        if (esqueci) esqueci.addEventListener('click', e => { e.preventDefault(); toast('Pedido de recuperação enviado (demo).'); });

        const utilizadoresDemo = {
        'oficina@exemplo.pt': { nome:'Oficina Demo', pass:'123456', tipo:'empresa' },
        'demo@lam.pt':        { nome:'Demo',         pass:'demo',   tipo:'cliente' }
        };
        let tentativas = 0;

        const loginForm = $('#loginForm');
        if (loginForm) loginForm.addEventListener('submit', e => {
        e.preventDefault();
        const email = $('#email').value.trim().toLowerCase();
        const pass  = $('#pass').value;
        const tipo  = tipoConta();
        const erro  = $('#erro');

        if (tentativas >= 5){ erro.textContent = 'Demasiadas tentativas.'; erro.style.display = 'block'; return; }
        if (!email || !pass){ erro.textContent = 'Introduza email e palavra-passe.'; erro.style.display = 'block'; return; }

        const u = utilizadoresDemo[email];
        if (u && u.pass === pass){
            if (u.tipo !== tipo){
            erro.textContent = u.tipo === 'empresa' ? 'Conta de empresa. Selecione "Empresa".' : 'Conta de cliente. Selecione "Cliente".';
            erro.style.display = 'block';
            erro.classList.remove('shake'); void erro.offsetWidth; erro.classList.add('shake');
            return;
            }
            erro.style.display = 'none';
            try { sessionStorage.setItem('lam-sessao', JSON.stringify({ nome:u.nome, tipo:u.tipo })); } catch(err) {}
            const btn = $('#btnEntrar');
            btn.disabled = true; btn.textContent = 'A entrar…';
            toast('Bem-vindo, ' + u.nome + '!');
            setTimeout(() => {
            btn.textContent = 'Entrado ✓';
            btn.style.background = 'var(--ok)'; btn.style.color = '#fff';
            setTimeout(() => {
                // Empresa vai para o painel, cliente para a index
                location.href = u.tipo === 'empresa' ? 'painel.php' : 'index.php';
            }, 700);
            }, 600);
            return;
        }
        tentativas++;
        erro.textContent = 'Email ou palavra-passe incorretos.';
        erro.style.display = 'block';
        erro.classList.remove('shake'); void erro.offsetWidth; erro.classList.add('shake');
        toast('Credenciais inválidas (demo: ' + textos[tipo].dica + ')');
        });
    }

    /* REGISTO */
    if (isRegisto) {
        const textos = {
        empresa: {
            titulo: 'Junte a sua oficina à <span class="gtext">rede LAM</span>.',
            texto: 'Crie a conta da sua empresa e comece a pesquisar, reservar e receber peças auto.',
            sub: 'Pedido de acesso para empresas e oficinas.',
            nome: 'Responsável', emailPh: 'geral@oficina.pt', btn: 'Pedir acesso'
        },
        cliente: {
            titulo: 'Encontre a peça certa, <span class="gtext">perto de si</span>.',
            texto: 'Crie a sua conta de cliente para pesquisar e reservar peças auto.',
            sub: 'Conta de cliente particular.',
            nome: 'Nome', emailPh: 'nome@email.pt', btn: 'Criar conta'
        }
        };
        const tipoConta = () => document.querySelector('input[name="conta"]:checked').value;

        function aplicarTipo(){
        const t = tipoConta(), x = textos[t];
        const oc = $('#optCliente'); if (oc) oc.classList.toggle('on', t === 'cliente');
        const oe = $('#optEmpresa'); if (oe) oe.classList.toggle('on', t === 'empresa');
        document.querySelectorAll('[data-so="empresa"]').forEach(c => {
            c.hidden = t !== 'empresa';
            c.classList.remove('bad');
            const m = c.querySelector('.msg'); if (m) m.textContent = '';
        });
        const cn = $('#campoNif'); if (cn) cn.classList.toggle('full', t === 'cliente');
        const ve = $('#vantEmpresa'); if (ve) ve.hidden = t !== 'empresa';
        const vc = $('#vantCliente'); if (vc) vc.hidden = t !== 'cliente';
        const st = $('#sideTitulo'); if (st) st.innerHTML = x.titulo;
        const sx = $('#sideTexto');  if (sx) sx.textContent = x.texto;
        const su = $('#subTxt');     if (su) su.textContent = x.sub;
        const nl = $('#nomeLbl');    if (nl) nl.textContent = x.nome;
        const em = $('#email');      if (em) em.placeholder = x.emailPh;
        const bt = $('#btn');        if (bt) bt.textContent = x.btn;
        const er = $('#erro');       if (er) er.hidden = true;
        }
        document.querySelectorAll('input[name="conta"]').forEach(r => r.addEventListener('change', aplicarTipo));
        if (new URLSearchParams(location.search).get('tipo') === 'cliente') {
        const c = document.querySelector('input[value="cliente"]'); if (c) c.checked = true;
        }
        aplicarTipo();

        document.querySelectorAll('.ver').forEach(b => b.addEventListener('click', () => {
        const i = $('#' + b.dataset.alvo), mostrar = i.type === 'password';
        i.type = mostrar ? 'text' : 'password'; b.textContent = mostrar ? 'Ocultar' : 'Mostrar';
        }));

        function forca(p){
        let s = 0;
        if (p.length >= 8) s++;
        if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
        if (/\d/.test(p)) s++;
        if (/[^A-Za-z0-9]/.test(p) || p.length >= 12) s++;
        return p ? Math.max(1, s) : 0;
        }
        const pwEl = $('#pw');
        if (pwEl) pwEl.addEventListener('input', e => {
        const s = forca(e.target.value), cores = ['', '#dc2626', '#d97706', '#65a30d', '#16a34a'], nomes = ['', 'Fraca', 'Razoável', 'Boa', 'Forte'];
        document.querySelectorAll('.forca i').forEach((el, n) => el.style.background = n < s ? cores[s] : '');
        const ft = $('#forcaTxt'); if (ft) ft.textContent = nomes[s];
        });

        function nifValido(n){
        if (!/^\d{9}$/.test(n)) return false;
        let soma = 0;
        for (let i = 0; i < 8; i++) soma += +n[i] * (9 - i);
        const d = 11 - (soma % 11);
        return +n[8] === (d >= 10 ? 0 : d);
        }

        const regras = {
        empresa: v => v.trim().length >= 2 || 'Indique o nome da empresa.',
        nif:     v => nifValido(v.trim()) || 'NIF inválido.',
        tipo:    v => !!v || 'Selecione o tipo de empresa.',
        nome:    v => v.trim().length >= 3 || 'Indique o nome.',
        tel:     v => /^(\+351)?\s?[29]\d{2}\s?\d{3}\s?\d{3}$/.test(v.trim()) || 'Telefone inválido.',
        email:   v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) || 'Email inválido.',
        morada:  v => v.trim().length >= 5 || 'Indique a morada.',
        cp:      v => /^\d{4}-\d{3}$/.test(v.trim()) || 'Código postal inválido.',
        local:   v => v.trim().length >= 2 || 'Indique a localidade.',
        pw:      v => v.length >= 8 || 'Mínimo de 8 caracteres.',
        pw2:     v => v === $('#pw').value || 'As palavras-passe não coincidem.'
        };
        function validar(id){
        const el = $('#' + id); if (!el) return true;
        const campo = el.closest('.campo');
        if (!campo || campo.hidden) return true;
        const r = regras[id](el.value);
        campo.classList.toggle('bad', r !== true);
        const m = campo.querySelector('.msg'); if (m) m.textContent = r === true ? '' : r;
        return r === true;
        }
        Object.keys(regras).forEach(id => {
        const el = $('#' + id); if (el) el.addEventListener('blur', () => validar(id));
        });
        const nifEl = $('#nif');
        if (nifEl) nifEl.addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, ''));
        const cpEl = $('#cp');
        if (cpEl) cpEl.addEventListener('input', e => {
        const d = e.target.value.replace(/\D/g, '').slice(0, 7);
        e.target.value = d.length > 4 ? d.slice(0, 4) + '-' + d.slice(4) : d;
        });

        const formEl = $('#form');
        if (formEl) formEl.addEventListener('submit', e => {
        e.preventDefault();
        const erro = $('#erro');
        const todos = Object.keys(regras).map(validar).every(Boolean);
        if (!todos || !$('#termos').checked){
            erro.textContent = todos ? 'Tem de aceitar os termos.' : 'Corrija os campos assinalados.';
            erro.hidden = false; erro.classList.remove('shake'); void erro.offsetWidth; erro.classList.add('shake');
            return;
        }
        erro.hidden = true;
        const empresa = tipoConta() === 'empresa';
        const btn = $('#btn'); btn.disabled = true; btn.textContent = 'A enviar…';
        setTimeout(() => {
            const mail = $('#email').value.trim().replace(/[&<>"']/g, '');
            $('#card').innerHTML = `<div class="ok-box"><div class="tick">✓</div>
            <h2>${empresa ? 'Pedido enviado' : 'Conta criada'}</h2>
            <p>${empresa
                ? `Vamos verificar os dados e enviar confirmação para <b>${mail}</b>.`
                : `Enviámos confirmação para <b>${mail}</b>. Já pode iniciar sessão.`}</p>
            <a class="entrar" href="login.php">Ir para o login</a></div>`;
        }, 900);
        });
    }
    })();


    /* =========================================================
    BLOCO 3 · PAINEL DE VENDEDOR (painel.html / painel.php)
    ========================================================= */
    (function () {
    if (!document.querySelector('.painel')) return;

    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const eur = v => new Intl.NumberFormat('pt-PT', { minimumFractionDigits: 2 }).format(v) + ' €';

    function toast(msg, ms = 2400){
        const t = $('#toast'); if (!t) return;
        t.textContent = msg; t.classList.add('on');
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms);
    }

    const temaBtn = $('#tema');
    function pintarTema(){ if (temaBtn) temaBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
    pintarTema();
    if (temaBtn) temaBtn.addEventListener('click', () => {
        const novo = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = novo;
        try { localStorage.setItem('lam-theme', novo); } catch(e) {}
        pintarTema();
    });

    const burger = $('.burger');
    if (burger) burger.addEventListener('click', () => $('.top nav').classList.toggle('open'));

    /* Dados */
    const categorias = [
        ['Motor','⚙️'],['Travagem','🛑'],['Suspensão','🔩'],['Elétrica','⚡'],
        ['Arrefecimento','❄️'],['Iluminação','💡'],['Pneus','🛞'],['Carroçaria','🚗']
    ];

    let produtos = [
        {ref:'BRK-1024', titulo:'Pastilhas de travão dianteiras', cat:'Travagem',  estado:'Novo',           preco:120, stock:8},
        {ref:'FLT-2210', titulo:'Filtro de óleo',                 cat:'Motor',     estado:'Novo',           preco:15,  stock:42},
        {ref:'AMT-7781', titulo:'Amortecedor traseiro',           cat:'Suspensão', estado:'Usado',          preco:95,  stock:3},
        {ref:'ALT-5540', titulo:'Alternador 90A',                 cat:'Elétrica',  estado:'Recondicionado', preco:210, stock:2}
    ];

    let reservas = [
        {id:1, cliente:'Oficina Central Lda',     ref:'BRK-1024', qtd:2, data:'2026-10-14', estado:'Pendente'},
        {id:2, cliente:'Auto Reparações Silva',   ref:'FLT-2210', qtd:5, data:'2026-10-15', estado:'Confirmada'},
        {id:3, cliente:'Garagem do Oeste',        ref:'ALT-5540', qtd:1, data:'2026-10-15', estado:'Pendente'}
    ];

    /* Select categorias */
    const selectCat = $('#p-cat');
    if (selectCat) {
        selectCat.innerHTML = categorias.map(([c,i]) => `<option value="${esc(c)}">${i} ${esc(c)}</option>`).join('');
    }

    /* KPIs */
    function renderKpis(){
        const el = $('#kpis'); if (!el) return;
        const valorStock = produtos.reduce((s,p) => s + p.preco * (p.stock || 0), 0);
        const pendentes = reservas.filter(r => r.estado === 'Pendente').length;
        el.innerHTML = `
        <div class="kpi"><span class="ico">📦</span><b>${produtos.length}</b><span>Produtos</span></div>
        <div class="kpi"><span class="ico">💰</span><b>${eur(valorStock)}</b><span>Valor em stock</span></div>
        <div class="kpi"><span class="ico">🛒</span><b>${reservas.length}</b><span>Reservas totais</span></div>
        <div class="kpi"><span class="ico">⏳</span><b>${pendentes}</b><span>Reservas pendentes</span></div>
        `;
    }

    /* Tabela produtos */
    function renderProdutos(){
        const tbody = document.querySelector('#tabelaProdutos tbody');
        const vazio = $('#vazioProdutos');
        if (!tbody) return;

        const q = ($('#pesquisaProduto')?.value || '').toLowerCase();
        const filtrados = produtos.filter(p =>
        !q || (p.titulo + p.ref + p.cat + p.estado).toLowerCase().includes(q)
        );

        if (!filtrados.length){
        tbody.innerHTML = '';
        if (vazio) vazio.hidden = false;
        return;
        }
        if (vazio) vazio.hidden = true;

        tbody.innerHTML = filtrados.map(p => `
        <tr>
            <td><span class="plate"><span>${esc(p.ref)}</span></span></td>
            <td>${esc(p.titulo)}</td>
            <td>${esc(p.cat)}</td>
            <td><span class="tag">${esc(p.estado)}</span></td>
            <td class="num">${eur(p.preco)}</td>
            <td class="acoes-linha">
            <button class="ico-btn" data-acao="editar" data-ref="${esc(p.ref)}" title="Editar">✏️</button>
            <button class="ico-btn perigo" data-acao="apagar" data-ref="${esc(p.ref)}" title="Apagar">🗑️</button>
            </td>
        </tr>
        `).join('');
    }

    /* Formulário */
    const form = $('#formProduto');
    const btnCancelar = $('#btnCancelar');
    const formTitulo = $('#formTitulo');
    const btnGuardar = $('#btnGuardar');

    function limparForm(){
        if (!form) return;
        form.reset();
        $('#p-original').value = '';
        formTitulo.textContent = 'Adicionar produto';
        btnGuardar.textContent = 'Guardar';
        if (btnCancelar) btnCancelar.hidden = true;
    }

    const addBtn = $('#addProduto');
    if (addBtn) addBtn.addEventListener('click', () => {
        limparForm();
        $('#p-titulo').focus();
    });
    if (btnCancelar) btnCancelar.addEventListener('click', limparForm);

    if (form) form.addEventListener('submit', e => {
        e.preventDefault();
        const titulo = $('#p-titulo').value.trim();
        const ref    = $('#p-ref').value.trim().toUpperCase();
        const preco  = parseFloat($('#p-preco').value);
        const cat    = $('#p-cat').value;
        const estado = $('#p-estado').value;
        const original = $('#p-original').value;

        if (!titulo || !ref || isNaN(preco)){ toast('Preencha todos os campos.'); return; }

        const refExiste = produtos.some(p => p.ref === ref && p.ref !== original);
        if (refExiste){ toast('Já existe um produto com essa referência.'); return; }

        if (original){
        const idx = produtos.findIndex(p => p.ref === original);
        if (idx > -1){
            produtos[idx] = { ...produtos[idx], ref, titulo, preco, cat, estado };
            toast('Produto atualizado ✓');
        }
        } else {
        produtos.unshift({ ref, titulo, preco, cat, estado, stock: 0 });
        toast('Produto adicionado ✓');
        }
        limparForm();
        renderProdutos();
        renderKpis();
    });

    /* Ações da tabela */
    const tabela = $('#tabelaProdutos');
    if (tabela) tabela.addEventListener('click', e => {
        const btn = e.target.closest('.ico-btn'); if (!btn) return;
        const acao = btn.dataset.acao;
        const ref  = btn.dataset.ref;
        const p    = produtos.find(x => x.ref === ref);
        if (!p) return;

        if (acao === 'editar'){
        $('#p-titulo').value = p.titulo;
        $('#p-ref').value    = p.ref;
        $('#p-preco').value  = p.preco;
        $('#p-cat').value    = p.cat;
        $('#p-estado').value = p.estado;
        $('#p-original').value = p.ref;
        formTitulo.textContent = 'Editar produto';
        btnGuardar.textContent = 'Atualizar';
        if (btnCancelar) btnCancelar.hidden = false;
        $('#p-titulo').focus();
        window.scrollTo({top:0, behavior:'smooth'});
        }
        if (acao === 'apagar'){
        if (!confirm(`Apagar "${p.titulo}"?`)) return;
        produtos = produtos.filter(x => x.ref !== ref);
        toast('Produto apagado.');
        renderProdutos();
        renderKpis();
        }
    });

    /* Pesquisa */
    const pesquisa = $('#pesquisaProduto');
    if (pesquisa) pesquisa.addEventListener('input', renderProdutos);

    /* Reservas */
    function renderReservas(){
        const el = $('#listaReservas'); if (!el) return;
        if (!reservas.length){ el.innerHTML = '<p class="vazio">Sem reservas de momento.</p>'; return; }

        el.innerHTML = reservas.map(r => {
        const p = produtos.find(x => x.ref === r.ref);
        const titulo = p ? p.titulo : r.ref;
        const total  = p ? p.preco * r.qtd : 0;
        return `
            <div class="reserva ${r.estado === 'Pendente' ? 'pend' : 'ok'}">
            <div class="r-info">
                <b>${esc(r.cliente)}</b>
                <span>${esc(titulo)} <small>(${esc(r.ref)})</small></span>
                <span class="r-meta">Qtd: ${r.qtd} · ${esc(r.data)}</span>
            </div>
            <div class="r-lado">
                <span class="tag">${esc(r.estado)}</span>
                <span class="preco">${eur(total)}</span>
                <div class="r-acoes">
                ${r.estado === 'Pendente'
                    ? `<button class="ico-btn ok" data-res="${r.id}" data-estado="Confirmada" title="Confirmar">✓</button>
                    <button class="ico-btn perigo" data-res="${r.id}" data-estado="Cancelada" title="Cancelar">✕</button>`
                    : ''}
                </div>
            </div>
            </div>`;
        }).join('');
    }

    const listaRes = $('#listaReservas');
    if (listaRes) listaRes.addEventListener('click', e => {
        const b = e.target.closest('.ico-btn[data-res]'); if (!b) return;
        const id = +b.dataset.res;
        const r = reservas.find(x => x.id === id);
        if (!r) return;
        r.estado = b.dataset.estado;
        toast('Reserva ' + r.estado.toLowerCase() + '.');
        renderReservas();
        renderKpis();
    });

    /* Init */
    renderKpis();
    renderProdutos();
    renderReservas();
    })();
</script>
